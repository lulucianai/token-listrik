# Cloudflare Worker: tempmail API + Email Routing receiver
# Docs: workers/tempmail/README.md
#
# Before deploy:
#   1. npx wrangler login
#   2. npx wrangler kv namespace create TEMPMAIL_KV
#   3. paste id below
#   4. npx wrangler secret put API_KEY   (optional but recommended)
#   5. set ALLOWED_DOMAINS to your domain(s)

name = "token-listrik-tempmail"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

# Comma-separated domains that may receive mail / create inboxes
[vars]
ALLOWED_DOMAINS = "example.com"
# Message retention (seconds) — default 24h
MESSAGE_TTL_SECONDS = "86400"
# Session retention (seconds) — default 24h
SESSION_TTL_SECONDS = "86400"
# Max messages kept per inbox
MAX_MESSAGES_PER_INBOX = "50"

# Create with: npx wrangler kv namespace create TEMPMAIL_KV
[[kv_namespaces]]
binding = "MAIL_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
# preview_id = "REPLACE_WITH_PREVIEW_ID"

# Email Routing → this worker (configured in Cloudflare Dashboard)
# Enable Email Routing on your zone, then create:
#   Catch-all / custom address → Send to a Worker → token-listrik-tempmail
