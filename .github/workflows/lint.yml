name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        # Soft gate: warn-level noise (page.evaluate globals, pre-existing indent)
        # must not block merges while we keep real parse/syntax issues red.
        run: npx eslint index.js src --max-warnings 999
